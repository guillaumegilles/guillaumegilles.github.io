# Shared front-matter for the French teaching pages.
# This file is self-contained: fr/ does not inherit from teaching/_metadata.yml.
# NOTE: format.html.* is intentionally absent here — adding format.html.*
# to a directory that also contains RevealJS slides causes Quarto to render
# those slides both as RevealJS AND as HTML, producing a broken output.
# The language switcher is injected via include-in-header in _quarto.yml.
lang: fr
execute:
  echo: false
comments:
  hypothesis: true
