# Shared front-matter for RevealJS slide decks.
# format.html.toc is explicitly disabled here to prevent Quarto from rendering
# these files as both RevealJS AND HTML (which produces broken output).
format:
  revealjs:
    theme: ../../../../assets/dark-slides.scss
    slide-number: true
    progress: true
    controls: true
    transition: slide
    fig-align: center
