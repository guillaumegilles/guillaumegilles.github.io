# Shared front-matter for the RevealJS slide decks of the Mathematical
# Finance course. Mirrors fr/teaching/mathematical-fundamentals/slides/.
# format.html.* is intentionally absent to prevent Quarto from rendering
# these files as both RevealJS AND HTML (which produces broken output).
format:
  revealjs:
    theme:
      - ../../../../assets/dark-slides.scss
      - finance-slides.scss
    slide-number: c/t
    progress: true
    controls: true
    transition: slide
    background-transition: fade
    fig-align: center
    center-title-slide: true
    chalkboard:
      theme: chalkboard
      boardmarker-width: 3
