# ---- Quarto Render Information
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!*.md"
  post-render:
    - scripts/update-profile-readme.sh
  resources:
    - CNAME
    - assets/giscus-neutral-light.css

execute:
  freeze: auto

# ---- Website Project Configuration
website:
  title: "Guillaume Gilles"
  llms-txt: true

  # ---- Navigation
  page-navigation: true
  search: true
  site-url: https://ggilles.dev   # RSS feed

  navbar:
    logo: assets/profile.jpeg
    title: false
    left:
      - href: about.qmd
      - href: index.qmd
      - href: teaching.qmd
    tools:
      - icon: translate
        text: "Langue / Language"
        menu:
          - text: "🇬🇧 English"
            href: /teaching.html
          - text: "🇫🇷 Français"
            href: /fr/teaching.html

