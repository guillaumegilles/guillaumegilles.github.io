  open-graph:
    image: assets/og-image.jpg

# ------------------------------------------------------------------- #
#                             HTML Configuration                      #
# ------------------------------------------------------------------- #
format:
  html:
    toc: true
    toc-depth: 3
    smooth-scroll: true
    citations-hover: true
    citation-location: margin
    theme: assets/dark.scss
    include-in-header: assets/lang-switch.html
