##----------------------------------------------------------------------------##
#                           Quarto Render Information                          #
##----------------------------------------------------------------------------##
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!*.md"
  post-render:
    - scripts/update-profile-readme.sh
  resources:
    - CNAME
    - assets/giscus-retro-blackboard.css

execute:
  freeze: auto

# ------------------------------------------------------------------- #
#                         Website Configuration                       #
# ------------------------------------------------------------------- #
website:
  title: "Guillaume Gilles"

  # -------------------------- NAVIGATION --------------------------- #
  # offer the user the ability to navigate to the next page (or
  # previous page) at the bottom of the page that they’ve just finished
  # reading
  page-navigation: true

  # Search is enabled by default for websites (you can disable it with
  # search: false).
  search: true

  # RSS feed
  site-url: https://ggilles.dev

  navbar:
    logo: assets/favicon.png
    title: "Guillaume Gilles"
    left:
      - href: about.qmd
      - href: index.qmd
      - href: teaching.qmd
    tools:
      - icon: translate
        text: "Langue / Language"
        menu:
          - text: "🇬🇧 English"
            href: /teaching.html
          - text: "🇫🇷 Français"
            href: /fr/teaching.html

