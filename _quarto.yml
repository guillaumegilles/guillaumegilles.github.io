##----------------------------------------------------------------------------##
#                           Quarto Render Information                          #
##----------------------------------------------------------------------------##
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "fr/**/*.qmd"
    - "!*.md"
  post-render:
    - scripts/update-profile-readme.sh
  resources:
    - CNAME
    - assets/giscus-retro-blackboard.css

execute:
  freeze: auto

# ------------------------------------------------------------------- #
