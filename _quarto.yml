# ---- Quarto Render Information
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!*.md"
  post-render:
    - scripts/update-profile-readme.sh
  resources:
    - CNAME
    - assets/giscus-neutral-light.css

execute:
  freeze: auto

# ---- Site-wide document metadata (inherited by every .qmd in the project).
# It lives in the directory _metadata.yml files (posts/, teaching/) so root pages stay author-free: an inherited field cannot be unset per document (null fails validation, empty values fall through to the inherited one).
# Make every page citable: emits citation_* / Google Scholar meta tags (citation_author, citation_title, citation_publication_date, ...) in the HTML head.
citation: true
google-scholar: true

# ---- Website Project Configuration
website:
  title: "Guillaume Gilles"
  llms-txt: true

  # ---- Navigation
  page-navigation: true
  search: true
  site-url: https://ggilles.dev   # RSS feed

