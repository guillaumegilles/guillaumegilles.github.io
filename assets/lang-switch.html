<script>
document.addEventListener('DOMContentLoaded', function () {
  // Only show the language switcher on mathematical-fundamentals pages
  var path = window.location.pathname;
  var mathFrPath  = '/fr/teaching/mathematical-fundamentals/';
  var mathEnPath  = '/teaching/mathematical-fundamentals/';
  var isMathFr = path.startsWith(mathFrPath);
  var isMathEn = path.startsWith(mathEnPath);
  if (!isMathFr && !isMathEn) return;

  // Do not show on RevealJS presentation pages
  if (document.body.classList.contains('reveal')) return;

  var counterpart = isMathFr
    ? path.replace(/^\/fr/, '')
    : '/fr' + path;
  var label = isMathFr ? '🇬🇧 English version' : '🇫🇷 Version française';

  var p = document.createElement('p');
  p.className = 'lang-switch';
  var a = document.createElement('a');
  a.href = counterpart;
  a.textContent = label;
  p.appendChild(a);

  // Insert right after the page title (h1.title)
  var title = document.querySelector('h1.title');
  if (title && title.parentNode) {
    title.parentNode.insertBefore(p, title.nextSibling);
  } else {
    var content = document.querySelector('#quarto-document-content') ||
                  document.querySelector('main') ||
                  document.body;
    content.insertBefore(p, content.firstChild);
  }
});
</script>
